    {[0,1,2,3,4].map(i=>{const y=pad.t+ih-ih*i/4; return <g key={i}><line x1={pad.l} x2={w-pad.r} y1={y} y2={y} stroke={C.gridline}/><text x={pad.l-5} y={y+3} textAnchor="end" fontSize={9} fill={C.faint}>{Math.round(max*i/4)}</text></g>;})}
    {MONTHS.map((m,i)=><text key={i} x={X(i)} y={h-8} textAnchor="middle" fontSize={8} fill={C.faint}>{m[0]}</text>)}
    {lines.map((l,li)=>{ const pts=l.data.map((v,i)=>[X(i),Y(v)]); const cut=l.year===Y2?LM:12;
      const d=pts.slice(0,cut).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      return <g key={li}><path d={d} fill="none" stroke={l.color} strokeWidth={l.year===Y2?2.4:1.6} strokeDasharray={l.year===Y0?"3 3":"none"}/>
        {l.year===Y2&&pts.slice(0,cut).map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={2} fill={l.color}/>)}</g>;})}
  </svg>;
}
function Legend({items}){ return <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:6}}>{items.map((it,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:C.sub}}><span style={{width:14,height:3,background:it.dash?"none":it.color,display:"inline-block",borderRadius:2,...(it.dash?{borderTop:`2px dashed ${it.color}`}:{})}}/>{it.label}</span>)}</div>; }
function GroupedBars({series,cats,w=560,h=210}){
  const pad={l:40,r:12,t:14,b:40}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b; const max=Math.max(1,...series.flatMap(s=>s.data)); const gW=iw/cats.length, bW=gW/(series.length+0.6);
  return <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{display:"block"}}>
    {[0,1,2,3,4].map(i=>{const y=pad.t+ih-ih*i/4; return <g key={i}><line x1={pad.l} x2={w-pad.r} y1={y} y2={y} stroke={C.gridline}/><text x={pad.l-6} y={y+3} textAnchor="end" fontSize={9} fill={C.faint}>{Math.round(max*i/4)}</text></g>;})}
    {cats.map((cat,ci)=><g key={ci}>{series.map((s,si)=>{const v=s.data[ci],bh=ih*v/max,x=pad.l+ci*gW+gW*0.15+si*bW; return <rect key={si} x={x} y={pad.t+ih-bh} width={bW*0.9} height={bh} fill={s.color} rx={1}/>;})}
      <text x={pad.l+ci*gW+gW/2} y={h-pad.b+16} textAnchor="middle" fontSize={10} fill={C.sub}>{cat}</text></g>)}
  </svg>;
}
function Card({children,style}){ return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:18,...style}}>{children}</div>; }
function SectionTitle({children,sub}){ return <div style={{marginBottom:12}}><div style={{fontFamily:"Georgia,serif",fontSize:17,color:C.ink,fontWeight:600}}>{children}</div>{sub&&<div style={{fontSize:12,color:C.sub,marginTop:2}}>{sub}</div>}</div>; }
function Note({children,accent}){ return <div style={{background:"#faf6ec",border:`1px solid ${C.border}`,borderLeft:`3px solid ${accent||C.gold}`,borderRadius:6,padding:"12px 16px",marginBottom:16,fontSize:12,color:C.sub,lineHeight:1.55}}>{children}</div>; }
function Kpi({label,big,delta,foot}){ return <Card style={{flex:1,minWidth:180}}><div style={{fontSize:11.5,color:C.sub,marginBottom:8}}>{label}</div><div style={{fontFamily:"Georgia,serif",fontSize:30,color:C.ink,lineHeight:1}}>{big}</div><div style={{marginTop:8,fontSize:12}}>{delta}</div>{foot&&<div style={{marginTop:4,fontSize:11,color:C.faint}}>{foot}</div>}</Card>; }
const TH=({children,r,pl})=><th style={{textAlign:r?"right":"left",padding:"5px 4px",paddingLeft:pl||4,color:C.sub,fontSize:11,fontWeight:600}}>{children}</th>;
const TD=({children,r,pl,style})=><td style={{textAlign:r?"right":"left",padding:"7px 4px",paddingLeft:pl||4,...style}}>{children}</td>;

    {D.PEND.length>0&&<Card style={{borderLeft:`3px solid ${C.blue}`}}><SectionTitle sub="New styles appeared in the Kessler feed that aren't assigned to a program. They're excluded from every calculation until classified.">New SKUs — needs your call</SectionTitle>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr><TH>Style (as in Kessler feed)</TH><TH>Kessler SKU</TH><TH r>Aug sold</TH><TH r>On hand</TH><TH pl={14}>Classify as</TH></tr></thead>
      <tbody>{D.PEND.map((r,i)=><tr key={i} style={{borderTop:`1px solid ${C.border}`}}><TD style={mono}>{r[0]}</TD><TD><KSKU k={r[1]}/></TD><TD r>{r[2]}</TD><TD r>{r[3]}</TD><TD pl={14} style={{fontSize:11,color:C.sub}}>Special Order &nbsp;·&nbsp; Program name &nbsp;·&nbsp; Ignore</TD></tr>)}</tbody></table></Card>}
  </div>;
}

// ============================================================================ Stock Health (customer-safe)
function StockHealth(){
  const S=D.STOCK; const tK=sum(S.map(s=>s.koh)), tO=sum(S.map(s=>s.oo)), tD=sum(S.map(s=>s.dead));
  return <div>
    <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:16}}>
      <Kpi label={`Kessler On Hand (9 stores, end of ${MONTHS[LM-1]})`} big={`${tK} pcs`} delta={<span style={{color:C.sub}}>across the five programs</span>}/>
      <Kpi label="On order from ALTR" big={`${tO} pcs`} delta={<span style={{color:C.sub}}>due Sep 3 – Oct 5</span>} foot="Lands ahead of the holiday"/>
      <Kpi label="Dead stock" big={`${tD} pcs`} delta={<span style={{color:C.red,fontWeight:600}}>{D.DEAD.length} styles, 0 sold in 180 days</span>} foot="All in Fashion — 10 styles, prune candidates"/>
    </div>
    <Card style={{marginBottom:16}}><SectionTitle sub="What Kessler holds, what's inbound, how fast it turns. Days on hand = on-hand ÷ daily sell-through (their Tally report); high is slow.">Stock health by program</SectionTitle>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><TH>Program</TH><TH>Stage</TH><TH r>Styles</TH><TH r>Selling (90d)</TH><TH r pl={14}>On Hand</TH><TH r>On Order</TH><TH r>Days on hand</TH><TH r>Aged pcs</TH><TH r>Dead pcs</TH><TH r>Stock-out risk</TH></tr></thead>
      <tbody>{S.map((s,i)=><tr key={i} style={{borderTop:`1px solid ${C.border}`}}><TD style={{fontWeight:600}}>{s.name}</TD><TD><Tag tag={s.tag} small/></TD><TD r style={{color:C.sub}}>{s.skus}</TD><TD r style={{color:C.sub}}>{s.active}</TD><TD r pl={14} style={{fontWeight:600}}>{s.koh}</TD><TD r style={{color:s.oo>0?C.green:C.faint,fontWeight:s.oo>0?600:400}}>{s.oo}</TD><TD r style={{color:s.doh>250?C.red:s.doh<60?C.green:C.sub,fontWeight:s.doh>250?600:400}}>{s.doh}</TD><TD r style={{color:C.sub}}>{s.aged}</TD><TD r style={{color:s.dead>0?C.red:C.faint,fontWeight:s.dead>0?700:400}}>{s.dead}</TD><TD r style={{color:s.risk>0?C.red:C.faint,fontWeight:s.risk>0?700:400}}>{s.risk}</TD></tr>)}
        <tr style={{borderTop:`2px solid ${C.gold}`,fontWeight:700}}><TD>Total</TD><TD/><TD r>{sum(S.map(s=>s.skus))}</TD><TD r>{sum(S.map(s=>s.active))}</TD><TD r pl={14}>{tK}</TD><TD r style={{color:C.green}}>{tO}</TD><TD/><TD r>{sum(S.map(s=>s.aged))}</TD><TD r style={{color:C.red}}>{tD}</TD><TD r style={{color:C.red}}>{sum(S.map(s=>s.risk))}</TD></tr></tbody></table>
      {/*NARRATIVE*/}<div style={{fontSize:11.5,color:C.sub,marginTop:12,lineHeight:1.5,maxWidth:"82ch"}}>Single Prong sits long (387 days) with a big order inbound — deep, not short. 5 Stone is effectively out and effectively over. Fashion is the one to manage: 61 on hand, of which 38 are dead — the wide launch produced clear winners and clear losers.</div></Card>
    <Card><SectionTitle sub="≥3 on hand, zero sold in 180 days. Candidates to consolidate, return, or clear — and to stop reordering.">Dead stock</SectionTitle>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><TH>Kessler SKU</TH><TH>ALTR SKU</TH><TH>Program</TH><TH r>On Hand</TH><TH r>Sold 180d</TH></tr></thead>
      <tbody>{D.DEAD.map((r,i)=><tr key={i} style={{borderTop:`1px solid ${C.border}`}}><TD><KSKU k={r[0]}/></TD><TD style={mono}>{r[1]}</TD><TD style={{color:C.sub}}>{r[2]}</TD><TD r style={{fontWeight:600}}>{r[3]}</TD><TD r style={{color:C.red}}>{r[4]}</TD></tr>)}</tbody></table>
      {/*NARRATIVE*/}<div style={{fontSize:11,color:C.sub,marginTop:8}}>Pattern: the larger-carat fashion (500FF, 200FF, 300IH), the 041/141 200-series, and the 027/035/041 100EF in white gold didn't move. The winners are 1.00–1.50 ct EF/FF, disproportionately yellow gold.</div></Card>
  </div>;
}

// ============================================================================ New Launches (NEW)
function NewLaunches(){
  const ORDER=["Single Prong Band","Shared Prong Band","Fashion Band","Silver Fashion Bracelet","5 Stone Band"];
  const groups=ORDER.map(pg=>[pg,D.NEW.filter(r=>r[3]===pg).sort((a,b)=>b[5]-a[5]||b[6]-a[6])]).filter(g=>g[1].length);
  const lbl=(st)=>st==="Dead stock"?"Not moving":st;
  return <div>
    <Note accent={C.blue}><b style={{color:C.ink}}>Every style under 12 months old, grouped by program, with sell-through since launch.</b> {D.totals.newskus} styles have produced {D.totals.newunits} units this year — about a quarter of all volume. Sell-through % = sold ÷ (sold + on hand). This is the re-buy vs. drop view.</Note>
    <Card style={{marginBottom:16}}><SectionTitle sub={`Grouped by program; sorted by ${Y2} sales within each.`}>Launch performance</SectionTitle>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr><TH>Kessler SKU</TH><TH>ALTR SKU</TH><TH>Metal</TH><TH r>Age (mo)</TH><TH r>Sold {Y2}</TH><TH r>Last 90d</TH><TH r>Trend</TH><TH r pl={12}>On Hand</TH><TH r>On Order</TH><TH r>Sell-through</TH><TH>Status</TH></tr></thead>
      <tbody>{groups.map(([pg,rows])=>[
        <tr key={pg}><td colSpan={11} style={{padding:"10px 4px 4px",fontFamily:"Georgia,serif",fontSize:13.5,fontWeight:600,color:C.gold,borderBottom:`1px solid ${C.gold}`}}>{pg} <span style={{fontFamily:"system-ui,sans-serif",fontSize:11,color:C.faint,fontWeight:400,marginLeft:8}}>{rows.length} new styles · {sum(rows.map(r=>r[5]))} sold {Y2}</span></td></tr>,
        ...rows.map((r,i)=>{const [k,sku,mt,_pg,age,u26,s90,tr,oh,oo,stp,st]=r; return <tr key={pg+i} style={{borderTop:`1px solid ${C.border}`}}><TD><KSKU k={k}/></TD><TD style={mono}>{sku}</TD><TD><Metal m={mt}/></TD><TD r style={{color:C.sub}}>{age}</TD><TD r style={{fontWeight:600}}>{u26}</TD><TD r>{s90}</TD><TD r><TrendTag t={tr}/></TD><TD r pl={12} style={{color:oh<=1&&s90>0?C.red:C.sub}}>{oh}</TD><TD r style={{color:oo>0?C.green:C.faint}}>{oo}</TD><TD r style={{color:stp>=60?C.green:stp<=20&&oh>=3?C.red:C.sub,fontWeight:600}}>{stp}%</TD><TD><Status s={lbl(st)}/></TD></tr>;})
      ])}</tbody></table></Card>
    <Card><SectionTitle sub="On order, not yet in the sales feed. The Fashion color run — treat as a test.">Inbound new styles</SectionTitle>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{D.INBOUND.map((r,i)=><span key={i} style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:4,padding:"6px 10px",fontSize:12}}><span style={mono}>{r[0]}</span> <Metal m={r[1]}/> <span style={{color:C.sub}}>× {r[2]}</span></span>)}</div>
      <div style={{fontSize:11,color:C.sub,marginTop:10}}>24 pieces across 8 colorways (blue, green, pink, yellow) in WG/YG/RG. First read on which colors and metals move should drive the next re-buy.</div></Card>
  </div>;
}

// ============================================================================ Playbook (rebuilt)
function Playbook(){
  const plays=[
    ["1","Lock the Q4 core on yellow gold",C.gold,"Shared + Single Prong are 75% of volume and covered on white gold. The only stock-outs in the book are ZAB001-46II-B and ZAB034-46II-B — both YG, both rising. Order now; seed YG on the top three runs of each program (96/70/46 and 30/46/70).","Protects ~190 units/yr of core volume; YG is where the incremental unit comes from."],
    ["2","Scale silver — the cheapest growth lever",C.green,"28 YTD, 17 in the last 90 days, on a 5-style base. ZBR51 and ZBR54 are the fastest new styles on the board. Add 2–3 styles (cttw/length), seed 3–4 each ahead of Nov. Last Nov–Dec did 35 units on two styles.","Estimated retail at 2.5× cost. Q4 upside 15–25 units."],
    ["3","Prune and concentrate Fashion",C.green,"25 styles, 27 units, 38 pieces dead across 10 styles. Winners: 1.00–1.50 ct EF/FF, disproportionately YG, plus ZAB129/121/190 100EF. Losers: 500FF, 200FF, 027/035 100EF in white. Stop reordering the six dead styles; consolidate; redirect to winners in YG.","Turns a wide launch into a focused program; frees ~38 pcs of shelf."],
    ["4","Watch rose gold",C.blue,"It just appeared: ZAB181-150EF-B rose variant sold its only unit; ZAB113-100PK-C is inbound. Too early to bet, but a third fashion metal is worth a line.","Optionality — decide on the next re-buy."],
    ["5","Retire 5 Stone cleanly",C.red,"8 YTD, 2 in 90 days, 1 on hand across 14 styles. Stop replenishing; free the shelf for silver and fashion. Plan it for the January reset, not December.","Removes 14 idle styles from the assortment."],
    ["6","Be stocked for December",C.gold,"December is ~1.8× a normal month and last year closed on an 88-unit spike. ALTR holds NY stock for Kessler, so the ask is simple: confirm the 88 pieces on order land as scheduled (Sep 3 – Oct 5), and keep the yellow-gold core variants and silver in stock through the peak.","December is the year — availability is the lever."],
    ["7","Hold the $1,201–2,200 retail band",C.gold,"The $2,201+ tier is growing fast — heavier stones and the Shared Prong mix. Retail is up 27% same-period on 11% more units, so trade-up is doing the work. Keep width where the money is.","Mix, not volume, is carrying retail growth this year."],
  ];
  return <div>
    <Note><b style={{color:C.ink}}>The growth playbook — seven plays, in priority order.</b> Built from the data: the core is healthy and covered; all incremental growth is in silver, fashion and yellow gold, and a quarter of this year's volume came from styles under a year old. Directional Q4 upside from the new book: 30–40 units, roughly $50–70k estimated retail, without touching the core.</Note>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>{plays.map((p,i)=><Card key={i} style={{borderLeft:`4px solid ${p[2]}`,padding:"14px 18px"}}><div style={{display:"flex",gap:14}}><div style={{fontFamily:"Georgia,serif",fontSize:22,color:p[2],width:28,flexShrink:0}}>{p[0]}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:C.ink,marginBottom:4}}>{p[1]}</div><div style={{fontSize:12.5,color:C.sub,lineHeight:1.55}}>{p[3]}</div><div style={{fontSize:11.5,color:p[2],marginTop:6,fontWeight:600}}>{p[4]}</div></div></div></Card>)}</div>
    <Card style={{marginTop:16}}><SectionTitle sub={`Units by estimated-retail price band (cost × 2.5), ${Y0}–${Y2} YTD.`}>Where the demand is — retail price points</SectionTitle>
      <GroupedBars cats={D.meta.price_points.bands} series={[{data:D.meta.price_points[String(Y0)],color:C.y24},{data:D.meta.price_points[String(Y1)],color:C.y25},{data:D.meta.price_points[String(Y2)],color:C.y26}]}/>
      <Legend items={[{label:String(Y0),color:C.y24},{label:String(Y1),color:C.y25},{label:`${Y2} YTD`,color:C.y26}]}/></Card>
  </div>;
}

// ============================================================================ ALTR Build (INTERNAL)
function Build(){
  const B=D.BUILD; const tA=sum(B.map(b=>b.altr));
  return <div>
    <Note accent={C.red}><b style={{color:C.red}}>Internal — not for the customer deck.</b> ALTR On Hand = whole-unit NY stock to hold for 60-day next-day fulfillment, built up for the Nov–Dec peak (holiday multiplier: core 1.0–1.1×, Fashion 1.5×, Silver 2.0×, Sunset none), netted per style against Kessler's on-order. The 90/180-day reads are the raw velocity bases.</Note>
    <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:16}}>
      <Kpi label="ALTR On Hand — to hold in NY" big={`${tA} pcs`} delta={<span style={{color:C.sub}}>peak-built, net of on-order, per style</span>}/>
      <Kpi label="Kessler on order" big={`${sum(B.map(b=>b.oo))} pcs`} delta={<span style={{color:C.sub}}>to ship Sep 3 – Oct 5</span>} foot="Production commitments first"/>
      <Kpi label="Refill lead time" big="47 days" delta={<span style={{color:C.sub}}>production-to-stock</span>}/>
    </div>
    <Card><SectionTitle sub="Per program. Peak target = 60-day cover × holiday multiplier over the selling styles.">NY build plan</SectionTitle>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><TH>Program</TH><TH r>90-day read</TH><TH r>180-day read</TH><TH r>Peak target</TH><TH r>Kessler on order</TH><TH r pl={14}>ALTR On Hand</TH></tr></thead>
      <tbody>{B.map((b,i)=><tr key={i} style={{borderTop:`1px solid ${C.border}`}}><TD style={{fontWeight:600}}>{b.name}</TD><TD r style={{color:C.sub}}>{b.d90}</TD><TD r style={{color:C.sub}}>{b.d180}</TD><TD r>{b.peak}</TD><TD r style={{color:C.green}}>{b.oo}</TD><TD r pl={14} style={{fontWeight:700,fontSize:14}}>{b.altr}</TD></tr>)}
        <tr style={{borderTop:`2px solid ${C.gold}`,fontWeight:700}}><TD>Total</TD><TD r>{sum(B.map(b=>b.d90))}</TD><TD r>{sum(B.map(b=>b.d180))}</TD><TD r>{sum(B.map(b=>b.peak))}</TD><TD r style={{color:C.green}}>{sum(B.map(b=>b.oo))}</TD><TD r pl={14} style={{fontSize:14}}>{tA}</TD></tr></tbody></table>
      {/*NARRATIVE*/}<div style={{fontSize:11.5,color:C.sub,marginTop:12,lineHeight:1.5,maxWidth:"82ch"}}>Netting is per style, so one style's on-order can't cover another's gap — that's why Single Prong still needs 9 despite 37 inbound (those are the 30/70/18 runs; the gap is 46/100). Fashion's 30 inbound are new colorways, not cover for existing winners. The style-level ALTR On Hand column is on the Programs tab in this view.</div></Card>
  </div>;
}

// ============================================================================ Shell
function App(){
  const [tab,setTab]=useState("Overview"); const [internal,setInternal]=useState(false);
  const tabs=["Overview","Programs","Momentum","What to Order","New Launches","Stock Health","Playbook"].concat(internal?["ALTR Build"]:[]);
  const views={Overview:<Overview/>,Programs:<Programs internal={internal}/>,Momentum:<Momentum/>,"What to Order":<ToOrder/>,"New Launches":<NewLaunches/>,"Stock Health":<StockHealth/>,Playbook:<Playbook/>,"ALTR Build":<Build/>};
  if(!tabs.includes(tab)) setTab("Overview");
  return <div style={{background:C.bg,minHeight:"100vh",color:C.ink,fontFamily:"system-ui,-apple-system,Segoe UI,Roboto,sans-serif",padding:"22px 26px"}}><div style={{maxWidth:1100,margin:"0 auto"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",borderBottom:`2px solid ${C.gold}`,paddingBottom:14,marginBottom:18,flexWrap:"wrap",gap:10}}>
      <div><div style={{fontFamily:"Georgia,serif",fontSize:24,fontWeight:600}}>Kessler's Diamond Center <span style={{color:C.gold}}>·</span> Growth Dashboard</div>
        <div style={{fontSize:12.5,color:C.sub,marginTop:3}}>ALTR band & bracelet programs &nbsp;|&nbsp; {Y0} · {Y1} · {Y2} YTD through {MONTHS[LM-1]} &nbsp;|&nbsp; 9 stores &nbsp;|&nbsp; estimated retail = cost × 2.5</div></div>
      <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.faint,lineHeight:1.6}}>Prepared for Bekki (Merchandising) & Monica (Buying)<br/>Updated monthly · v6.5 · Sep 1, 2026</div>
        <button onClick={()=>setInternal(v=>!v)} style={{marginTop:6,fontSize:11,padding:"4px 10px",borderRadius:4,cursor:"pointer",border:`1px solid ${internal?C.red:C.border}`,background:internal?"#f6e6e3":C.bg,color:internal?C.red:C.sub,fontWeight:600}}>{internal?"Internal view — ON":"Customer view"}</button></div>
    </div>
    <div style={{display:"flex",gap:4,marginBottom:20,flexWrap:"wrap"}}>{tabs.map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"9px 14px",fontSize:13,cursor:"pointer",borderRadius:5,border:`1px solid ${tab===t?(t==="ALTR Build"?C.red:C.gold):C.border}`,background:tab===t?(t==="ALTR Build"?C.red:C.gold):C.bg,color:tab===t?"#fff":C.sub,fontWeight:tab===t?600:500}}>{t}</button>)}</div>
    {views[tab]}
    <div style={{fontSize:10.5,color:C.faint,marginTop:24,borderTop:`1px solid ${C.border}`,paddingTop:10,lineHeight:1.6}}>Units net of returns. 2026 full-year figures are seasonality projections from Jan–Aug actuals; Estimated retail = ALTR cost × 2.5. Order logic recomputed monthly from the full SKU universe. Kessler SKU shown is the item number with stock on hand where a style has more than one. Styles beginning ZZ are special orders: counted in unit and retail totals, excluded from programs. — ALTR Created Diamonds</div>
  </div></div>;
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
